[build]
  base = "frontend"
  # publish is resolved relative to base, so this is frontend/build.
  command = "npm run build"
  publish = "build"

[build.environment]
  # CRA treats warnings as errors on CI without this.
  CI = "false"
  NODE_VERSION = "20"

# REACT_APP_BACKEND_URL is set in the Netlify dashboard (Site settings > Environment
# variables). It is baked into the bundle at build time, so changing it needs a redeploy.
