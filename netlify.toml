[build]
  base = "frontend"
  command = "npm run build"
  # publish is relative to the repo root, NOT to base - verified against the real
  # Netlify CLI, which resolves "build" to <root>/build and fails. Leave the frontend/ prefix.
  publish = "frontend/build"

[build.environment]
  # CRA treats warnings as errors on CI without this.
  CI = "false"
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# The frontend posts to /api/contact; serve that from the function.
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# REACT_APP_BACKEND_URL is set in the Netlify dashboard (Site settings > Environment
# variables). It is baked into the bundle at build time, so changing it needs a redeploy.
